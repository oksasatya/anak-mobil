[package]
name = "anakmobil-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "anakmobil"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# `version` alongside `path` so this is not a wildcard requirement, which
# `cargo deny` rejects — a wildcard accepts any future version, including a
# breaking one.
anakmobil-domain = { path = "../domain", version = "0.1.0" }
anyhow = "1.0.104"
argon2 = "0.5.3"
axum = "0.8.9"
base64 = "0.23.1"
dotenvy = "0.15.7"
getrandom = "0.4.3"
# `connection-manager` reconnects on its own; without it a dropped Redis
# connection stays dropped and readiness never recovers.
redis = { version = "1.5.0", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
# `macros` gives compile-time-checked SQL. It needs either a reachable
# DATABASE_URL or the committed .sqlx cache; CI uses the cache, which is why
# `cargo sqlx prepare` runs whenever a query changes.
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "macros", "uuid"] }
thiserror = "2.0.20"
time = { version = "0.3.44", features = ["formatting"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.24.1", features = ["v7"] }

[dev-dependencies]
# `oneshot` drives a Router without binding a port, so the probe and envelope
# tests need neither a server nor a database.
http-body-util = "0.1.3"
# `test-util` gives `start_paused`, so the shutdown-deadline tests assert a
# 30-second budget without taking 30 seconds.
tokio = { version = "1.53.1", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }
