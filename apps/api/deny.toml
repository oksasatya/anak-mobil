# cargo-deny — supply-chain policy for the backend.
#
# Run locally with `cargo deny check`; CI runs it on every push.

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
# Permissive licences only. A copyleft dependency arriving unnoticed is a
# legal problem discovered at the worst possible moment.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # Boost. Permissive, no attribution required in binary form. Arrives with
    # `ryu`, the float formatter serde_json uses.
    "BSL-1.0",
    # Community Data Licence, permissive variant. Arrives with the Mozilla
    # root-certificate bundle that backs TLS to Postgres.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# Our own crates are never published, so they have no licence to check. The
# alternative — inventing an SPDX expression for a private crate — makes the
# check pass by lying to it.
private = { ignore = true }

[sources]
unknown-registry = "deny"
unknown-git = "deny"
